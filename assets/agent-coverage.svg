<svg xmlns="http://www.w3.org/2000/svg" width="960" height="610" viewBox="0 0 960 610" role="img" aria-labelledby="title desc">
<title id="title">Automatic coding-agent speech: documented coverage</title>
<desc id="desc">SpeakHarness supports four named coding harnesses: OMP, Pi, Codex and Claude Code. Aloud supports two: Codex and Claude Code. claudio-tts supports one: Claude Code. Counts describe built-in automatic reply integrations, not speed or quality. Checked October 11, 2026.</desc>
