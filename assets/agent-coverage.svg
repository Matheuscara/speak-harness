<text x="40" y="86" fill="#f3f0eb" font-size="30" font-weight="700">More agents. One listening desk.</text>
<text x="40" y="115" fill="#bcaea6" font-size="16">Built-in automatic reply integrations · distinct named coding harnesses</text>
